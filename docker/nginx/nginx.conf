worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream river-server {
        server river-server:48080;
    }

    upstream river-ecommica {
        server river-ecommica:3000;
    }

    # HTTP 重定向到 HTTPS
    server {
        listen 80;
        server_name deals.ecommica.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主服务
    server {
        listen 443 ssl http2;
        server_name deals.ecommica.com;

        # SSL 证书配置
        ssl_certificate /etc/nginx/ssl/deals.ecommica.com_bundle.pem;
        ssl_certificate_key /etc/nginx/ssl/deals.ecommica.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # 管理后台静态文件 - /admin 路径
        location /admin {
            alias /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # 管理后台静态资源 - 需要单独处理带 /admin 前缀的资源
        location /admin/assets {
            alias /usr/share/nginx/html/assets;
        }

        # 后端 API - 管理后台
        location /admin-api/ {
            proxy_pass http://river-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 后端 API - 公开接口
        location /app-api/ {
            proxy_pass http://river-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 优惠站 - 默认路径 (Next.js)
        location / {
            proxy_pass http://river-ecommica;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
