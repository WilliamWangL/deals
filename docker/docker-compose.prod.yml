version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: river-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-river}
      - TZ=Asia/Shanghai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - river-network

  redis:
    image: redis:7-alpine
    container_name: river-redis
    restart: always
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - river-network

  river-server:
    image: ghcr.io/${GITHUB_REPO:-river}/river-server:latest
    container_name: river-server
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Shanghai
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-river}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:48080/test || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - river-network

  river-ecommica:
    image: ghcr.io/${GITHUB_REPO:-river}/river-ecommica:latest
    container_name: river-ecommica
    restart: always
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://river-server:48080/app-api
    depends_on:
      river-server:
        condition: service_healthy
    networks:
      - river-network

  nginx:
    image: nginx:alpine
    container_name: river-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./admin-dist:/usr/share/nginx/admin:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - river-server
      - river-ecommica
    networks:
      - river-network

networks:
  river-network:
    driver: bridge
