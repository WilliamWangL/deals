version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: river-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-river}
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - river-network

  redis:
    image: redis:7-alpine
    container_name: river-redis
    restart: always
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - river-network

  river-server:
    image: ghcr.io/${GITHUB_REPO:-river}/river-server:latest
    container_name: river-server
    restart: always
    ports:
      - "127.0.0.1:48080:48080"  # 暴露给宿主机 Nginx 调用
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Shanghai
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-river}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:48080/test || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - river-network

  river-ecommica:
    image: ghcr.io/${GITHUB_REPO:-river}/river-ecommica:latest
    container_name: river-ecommica
    restart: always
    ports:
      - "127.0.0.1:3000:3000"    # 假设前端容器内部端口是3000，暴露给宿主机
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://river-server:48080/app-api
    depends_on:
      river-server:
        condition: service_healthy
    networks:
      - river-network

# 删除了原来的 nginx 服务块

networks:
  river-network:
    driver: bridge
